name: Profile Summary Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: gomez7373
          THEME: jolly
          UTC_OFFSET: -4

      # 🐍 NUEVO — genera la culebrita
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: gomez7373
          outputs: |
            dist/github-contribution-grid-snake.svg

      # 🐍 NUEVO — la mueve al mismo folder de JOLLY
      - name: Move snake into summary output
        run: |
          mkdir -p profile-summary-card-output/jolly
          cp dist/github-contribution-grid-snake.svg profile-summary-card-output/jolly/github-contribution-grid-snake.svg

      - name: Commit and push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git commit -m "chore: update profile summary cards" || exit 0
          git push
